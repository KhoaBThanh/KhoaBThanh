---
layout: default
---
<article>
  <h1 class="page-title">{{ page.title }}</h1>
  <p class="meta">{{ page.date | date: "%B %-d, %Y" }}{% if page.tags.size > 0 %} &middot; {{ page.tags | join: ", " }}{% endif %}</p>
{{ content }}
</article>
<hr>
<p class="meta"><a href="{{ '/blog/' | relative_url }}">All posts</a></p>
