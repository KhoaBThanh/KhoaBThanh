# ---------------------------------------------------------------------
# Build settings
# ---------------------------------------------------------------------
permalink: pretty
future: false

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
  hard_wrap: false
  syntax_highlighter: rouge

collections:
  projects:
    output: true
    permalink: /projects/:name/

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - Makefile
  - .bundle
  - vendor
  - scripts
